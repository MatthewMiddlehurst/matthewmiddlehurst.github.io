name: Update publications from ORCID

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC on the first day of each month.
    - cron: "0 8 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update publications from ORCID
        env:
          ORCID_ID: "0000-0002-3293-8779"
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python scripts/update_publications_orcid.py

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update publications from ORCID"
          branch: update-orcid-publications
          delete-branch: true
          title: "Update publications from ORCID"
          body: Automated monthly update of publications from the public ORCID record.
