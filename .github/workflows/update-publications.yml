name: Update publications from ORCID

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC on the first day of each month.
    - cron: "0 8 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Featured Works browser
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check "playwright>=1.54,<2"
          python -m playwright install --with-deps chromium

      - name: Update publications from ORCID
        id: update
        env:
          ORCID_ID: "0000-0002-3293-8779"
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
          PUBLICATION_UPDATE_REPORT: ${{ runner.temp }}/publication-update-report.md
        run: |
          python scripts/update_publications.py
          {
            echo "report<<EOF"
            cat "$PUBLICATION_UPDATE_REPORT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: update-orcid-publications
          delete-branch: true
          commit-message: "Update publications from ORCID"
          title: "Update publications from ORCID"
          body: |
            Updates the website publication data from Matthew Middlehurst's
            public ORCID record.

            ### Import status

            ${{ steps.update.outputs.report }}
          add-paths: |
            _data/publications.json
