name: Check links

on:
  workflow_dispatch:
  schedule:
    # 09:00 UTC on the first day of each month.
    - cron: "0 9 1 * *"
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build site with GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Test publication importer
        run: python3 -B -m unittest discover -s tests -v

      - name: Check rendered links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .github/lychee.toml
            --root-dir "${{ github.workspace }}/_site"
            --no-ignore
            --include-fragments
            --index-files index.html
            --verbose
            --no-progress
            --method get
            --timeout 20
            --max-retries 2
            './_site/**/*.html'
          fail: true
          failIfEmpty: true
          jobSummary: true
