---
layout: default
---
<article class="page-content">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: site.profile.name }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
  </header>
  {{ content }}
</article>
